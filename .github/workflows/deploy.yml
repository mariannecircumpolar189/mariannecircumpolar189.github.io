name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          AA80CA: ${{ secrets.AA80CA }}
          BA5394: ${{ secrets.BA5394 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('AA80CA', ''), os.environ.get('BA5394', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 621bbbc0082356a3c16197e472 -->', a)
          if b:
              patched = patched.replace('<!-- 2a19a7f6ab24f6dbdb086c3a92d43768c5a2d5 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
